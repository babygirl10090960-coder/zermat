<style>
/* Layout: app de una columna para celular, navegación fija abajo */
:root{
  --bg:#fbf6f8; --card:#ffffff; --ink:#2b1d24; --muted:#7a6670; --line:#eedde5;
  --brand:#b0476f; --brand-ink:#ffffff; --soft:#f7e6ee; --ok:#2f8a5b; --warn:#c07a12; --bad:#c0392b;
  --shadow:0 1px 3px rgba(80,20,50,.08),0 4px 14px rgba(80,20,50,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1216; --card:#251a20; --ink:#f5e9ef; --muted:#b9a2ad; --line:#3a2a32;
  --brand:#e07aa1; --brand-ink:#1a1216; --soft:#3a2430; --ok:#5cc28e; --warn:#e6a64a; --bad:#ef7a6c;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1a1216; --card:#251a20; --ink:#f5e9ef; --muted:#b9a2ad; --line:#3a2a32;
  --brand:#e07aa1; --brand-ink:#1a1216; --soft:#3a2430; --ok:#5cc28e; --warn:#e6a64a; --bad:#ef7a6c;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--brand);color:var(--brand-ink);padding-block:18px 14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header h1{margin:0;font-size:1.3rem}
header p{margin:2px 0 0;opacity:.9;font-size:.9rem}
#sync{font-size:.75rem;opacity:.85}
main{max-width:720px;margin:0 auto;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card,.msg{min-width:0;overflow-wrap:anywhere}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h2{font-size:1.1rem;margin:22px 0 10px}
h3{font-size:1rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
button,.btn{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--brand);color:var(--brand-ink);cursor:pointer;font-weight:600;text-decoration:none;display:inline-block}
button.sec{background:var(--soft);color:var(--ink)}
button.ghost{background:transparent;color:var(--brand);padding:6px 8px}
button.small{padding:6px 10px;font-size:.85rem}
button.danger{background:transparent;color:var(--bad)}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:170px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin-right:4px}
.pill.warn{background:var(--warn);color:#fff}.pill.ok{background:var(--ok);color:#fff}.pill.bad{background:var(--bad);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--brand)}
.stat span{font-size:.75rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{white-space:nowrap}
.msg{white-space:pre-wrap;font-size:.92rem;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0;border:1px dashed var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(4px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px))}
nav button{background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:.72rem;padding:4px 6px;font-weight:500}
nav button .i{font-size:1.35rem;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brand)}
.check.done span{text-decoration:line-through;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100% - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(30,10,20,.45)}
.dlg{padding:16px}
.dlg-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
ul.tips{padding-left:20px;margin:6px 0}ul.tips li{margin:4px 0}
details summary{cursor:pointer;font-weight:600}
.hidden{display:none}
.banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;min-height:150px;display:flex;align-items:flex-end;background:var(--soft)}

.acciones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.acciones button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;font-size:.82rem;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.acciones button .i{font-size:1.4rem}
.lock{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lock img{width:84px;height:84px;border-radius:20px}
.lock input{max-width:220px;text-align:center;font-size:1.6rem;letter-spacing:.5em}
.aviso{border-left:4px solid var(--warn)}
.lock.hidden{display:none}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;letter-spacing:-.005em}
header h1{font-size:1.4rem}
.lista{display:grid;grid-template-columns:1fr;gap:12px}
.lista > .card{margin:0}
.nav-marca,.nav-tienda{display:none}
nav button{border-radius:12px}
@media (min-width:700px){
  main{max-width:980px}
  .lista{grid-template-columns:repeat(2,minmax(0,1fr))}
  .acciones{grid-template-columns:repeat(4,1fr)}
  .banner{min-height:190px}
}
@media (min-width:960px){
  body{padding-bottom:0;padding-left:236px}

  nav button{flex-direction:row;gap:12px;font-size:.98rem;padding:11px 14px;width:100%;justify-content:flex-start}
  nav button .i{font-size:1.2rem}
  nav button.on{background:var(--soft);color:#963a5d}
  .nav-marca{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-family:"Fraunces",Georgia,serif;line-height:1.15;color:var(--ink)}
  .nav-marca img{border-radius:10px}
  .nav-tienda{display:block;margin-top:auto;padding:11px 14px;border-radius:12px;color:var(--brand);text-decoration:none;font-weight:600;border:1px solid var(--line)}
  header{padding-left:32px;padding-right:32px}
  main{max-width:1160px;padding-left:32px;padding-right:32px}
  .lista.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toast{bottom:32px;left:calc(50% + 118px)}
}
.barra-fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.barra-fil select,.barra-fil input{width:auto;flex:1;min-width:140px}
.score{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--brand)}
.chips button{flex:none}
.stat span{overflow-wrap:anywhere}
#volante{display:none}
@media print{
  body.imprimiendo > *:not(#volante){display:none !important}
  body.imprimiendo{padding:0;background:#fff}
  body.imprimiendo #volante{display:block}
  .vol{font-family:system-ui,sans-serif;color:#2b1d24;text-align:center;padding:10mm 12mm}
  .vol-top{font-size:16pt;color:#b0476f;margin:0}
  .vol h1{font-size:30pt;margin:6mm 0}
  .vol ul{list-style:none;padding:0;font-size:16pt;line-height:1.7;margin:0}
  .vol ul li::before{content:"✔ ";color:#b0476f}
  .vol-qr{width:60mm;margin:8mm auto 2mm}
  .vol-qr svg{width:100%;height:auto}
  .vol-cta{font-size:12pt;margin:0}
  .vol-yo{font-size:18pt;font-weight:700;margin:4mm 0 8mm}
  .vol-tiras{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px dashed #999}
  .vol-tiras div{border-right:1px dashed #999;padding:4mm 1mm;font-size:9pt;writing-mode:vertical-rl;transform:rotate(180deg);height:45mm}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script>
/* Errores: mensaje amable sin detalles técnicos; se guardan los últimos 20 en este aparato para revisarlos */
(function(){
  let aviso=0;
  function anotar(msg){
    try{ const L=JSON.parse(localStorage.getItem('mf.errores')||'[]'); L.push({f:new Date().toISOString(),m:String(msg).slice(0,300),p:location.pathname}); localStorage.setItem('mf.errores',JSON.stringify(L.slice(-20))); }catch(e){}
    if(aviso++) return;
    const d=document.createElement('div'); d.setAttribute('role','alert');
    d.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#2a0f22;color:#fff;padding:14px 16px;border-radius:14px;font:15px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:520px;margin:auto';
    d.textContent='Algo no salió bien. Recarga la página; tus datos siguen guardados. ';
    const b=document.createElement('button'); b.textContent='Recargar'; b.style.cssText='margin-left:6px;background:#fff;color:#2a0f22;border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer';
    b.onclick=()=>location.reload(); d.appendChild(b); (document.body||document.documentElement).appendChild(d);
  }
  addEventListener('error', e=>{ if(e.target && e.target!==window) return; anotar(e.message); });
  addEventListener('unhandledrejection', e=>anotar(e.reason && e.reason.message || e.reason));
})();
</script>

<script>
/* ===================== Datos ===================== */
const KEY = 'misFragancias.v1';
const hoyISO = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const uid = () => Math.random().toString(36).slice(2,10);
const defaults = () => ({
  ajustes:{miNombre:'',miWhats:'',pais:'1',desde:'',inscripcion:'',comision:'',anticipo:'',promo:''},
  clientas:[], equipo:[], perfumes:[], plan:{semana:'',hechos:[]}, seguridad:null, ultimoRespaldo:'', interesadas:[], planRec:null, negocios:[], ayudantes:[], pagosAyud:[]
});
const LOCAL = 'Guardado en este aparato';
let S;
try{ S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){ S = defaults(); }

/* Nube: tus datos se guardan en tu cuenta, en una carpeta privada que solo tú ves */
let nube = null, subiendo = false, pendiente = false, timerNube = null;
function estadoSync(t){ const el=document.getElementById('sync'); if(el) el.textContent=t; }
function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('⚠️ El aparato está lleno. Descarga un respaldo en Más.'); }
  if(!nube) return;
  clearTimeout(timerNube); timerNube = setTimeout(subir, 800);
}
async function subir(){
  if(!nube) return;
  if(subiendo){ pendiente = true; return; }
  subiendo = true; estadoSync('Guardando…');
  try{ await nube.set({estado: JSON.stringify(S), actualizado: new Date().toISOString()}); estadoSync('☁️ Guardado en tu cuenta (privado)'); }
  catch(e){ estadoSync(e && e.code==='quota_exceeded' ? '⚠️ Tu espacio está lleno. Descarga un respaldo.' : '⚠️ No se pudo guardar en tu cuenta. '+LOCAL+'.'); }
  subiendo = false;
  if(pendiente){ pendiente = false; subir(); }
}
async function conectarNube(){
  try{
    if(!window.claude || !window.claude.use){ estadoSync('📱 '+LOCAL); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if(!db || !user){ estadoSync('📱 '+LOCAL); return; }
    const id = await user.id();
    if(!id){ estadoSync('📱 '+LOCAL); return; }
    const ref = db.doc('data/users/' + id + '/estado');
    const snap = await ref.get();
    nube = ref;
    if(snap.exists){
      try{ S = Object.assign(defaults(), JSON.parse(snap.data().estado||'{}')); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
      estadoSync('☁️ Guardado en tu cuenta (privado)'); render();
    } else if(S.clientas.length || S.perfumes.length || S.equipo.length || S.ajustes.miNombre){
      subir();
    } else estadoSync('☁️ Guardado en tu cuenta (privado)');
  }catch(e){ estadoSync('📱 '+LOCAL); }
}

const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dias = iso => iso ? Math.floor((new Date(hoyISO()) - new Date(iso))/864e5) : 0;
const fmtFecha = iso => iso ? new Date(iso+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'}) : '';
const dinero = n => { const v=Number(n)||0; return '$' + v.toLocaleString('es-MX',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2}); };

/* ===================== Mensajes ===================== */
const CATS = ['Vender','Clientas','Leads','Estados','Mayoreo','Grupos y negocios','Equipo','Reclutar','Fechas'];
const MENSAJES = [
 {id:'muestra',cat:'Vender',t:'🎁 Al regalar una muestra',x:'¡Hola {nombre}! 🌸 Te traje una muestra de {perfume}, una de mis fragancias favoritas de Zermat. Pruébala unos días y me cuentas qué te parece 😊 Si te gusta, el frasco completo cuesta {precio} y te lo puedo apartar.'},
 {id:'seguimiento',cat:'Vender',t:'💬 Seguimiento de muestra (a los 3 días)',x:'¡Hola {nombre}! ¿Cómo te fue con la muestra de {perfume}? 😊 ¿Te gustó cómo te duró? Esta semana te lo puedo entregar en {dia} y si quieres lo puedes pagar en 2 quincenas 💕'},
 {id:'conocidas',cat:'Vender',t:'👋 Primer mensaje a conocidas',x:'¡Hola {nombre}! ¿Cómo estás? 😊 Te cuento que ahora estoy vendiendo fragancias y productos Zermat ✨ Tengo perfumes muy ricos para dama y caballero desde {desde}. Si quieres te mando el catálogo o te llevo muestras para que los pruebes, ¡sin compromiso! 🌸'},
 {id:'apartado',cat:'Vender',t:'💳 Ofrecer apartado o pagos',x:'¿Te gustó pero no es buen momento? 😊 ¡No te preocupes! Te lo aparto con {anticipo} y el resto me lo pagas en 2 quincenas o cuando te quede mejor 💕'},
 {id:'tarde',cat:'Vender',t:'🏡 Invitación a tarde de fragancias',x:'¡Hola {nombre}! 🌸 Te invito a una tarde de fragancias en mi casa el {dia} a las {hora} ☕✨ Vamos a probar perfumes y cremas, platicar y pasarla bonito. ¡Puedes traer a una amiga! ¿Te espero? 💕'},
 {id:'referidas',cat:'Clientas',t:'🤝 Pedir referidas',x:'¡Gracias por tu compra, {nombre}! 💖 Te quiero pedir un favor: si conoces a alguien a quien le gusten los perfumes, ¿me recomendarías? Por cada amiga que me compre te regalo una muestra o un descuento en tu próxima compra 🎁'},
 {id:'recompra',cat:'Clientas',t:'🔁 Clienta que ya compró (2–3 meses)',x:'¡Hola {nombre}! 🌸 ¿Cómo vas con tu {perfume}? Ya debe estar por acabarse 😄 ¿Quieres que te aparte otro, o te gustaría probar algo nuevo? Este mes tengo {promo} ✨'},

 {id:'gracias',cat:'Clientas',t:'💖 Gracias por tu compra',x:'¡Muchas gracias por tu compra, {nombre}! 💖 Espero que disfrutes mucho tu {perfume}. Cualquier cosa que necesites aquí estoy 🌸'},

 {id:'est2',cat:'Estados',t:'🎁 Sets de regalo',x:'¿Tienes un cumpleaños, aniversario o quieres quedar bien? 🎁 Te armo un set de regalo con perfume + crema desde {desde}. ¡Escríbeme! 💌'},

function rellenar(texto, ctx={}){
  const a = S.ajustes;
  const val = {
    miNombre:a.miNombre, miWhats:a.miWhats, desde:a.desde&&('$'+String(a.desde).replace(/^\$/,'')),
    inscripcion:a.inscripcion&&('$'+String(a.inscripcion).replace(/^\$/,'')),
    comision:a.comision&&('$'+String(a.comision).replace(/^\$/,'')),
    anticipo:a.anticipo&&('$'+String(a.anticipo).replace(/^\$/,'')),
    promo:a.promo, zona:a.zona, descMayoreo:a.descMayoreo&&(String(a.descMayoreo).replace(/%$/,'')+'%'), comisionNeg:a.comisionNeg&&(String(a.comisionNeg).replace(/%$/,'')+'%'), negocio_en:ctx.negocio?' en '+ctx.negocio:'', enlace:a.miWhats?'wa.me/'+telWa(a.miWhats):undefined, ...ctx
  };
  return texto.replace(/\{(\w+)\}/g,(m,k)=> (val[k]!==undefined && val[k]!=='' && val[k]!==null) ? val[k] : '['+({miNombre:'tu nombre',miWhats:'tu número',saldo:'cantidad'}[k]||k)+']');
}

const $ = s => document.querySelector(s);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),1800); }
const dlg = $('#dlg');
function abrir(html){ $('#dlgBody').innerHTML = html; preparar($('#dlgBody')); dlg.showModal(); }
/* Accesibilidad y límites: une cada etiqueta con su campo y pone un largo máximo a todo lo que se escribe */
function preparar(root){
  root.querySelectorAll('label:not([for])').forEach(l=>{ const c=l.nextElementSibling; if(c && /^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)){ if(!c.id) c.id='c'+uid(); l.htmlFor=c.id; } });
  root.querySelectorAll('input:not([maxlength]):not([type=number]):not([type=date]):not([type=file]):not([type=checkbox]):not([type=radio])').forEach(i=>i.maxLength=i.type==='tel'?25:200);
  root.querySelectorAll('textarea:not([maxlength])').forEach(t=>t.maxLength=5000);
  root.querySelectorAll('input[type=number]:not([max])').forEach(i=>{ i.min=i.min||0; i.max=100000; });
}
function cerrar(){ dlg.close(); despuesDeGuardar = null; }
dlg.addEventListener('click',e=>{ if(e.target===dlg) cerrar(); });

async function copiar(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('¡Copiado! 📋');
}
function telWa(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  const p = String(S.ajustes.pais||'').replace(/\D/g,'');
  if(p && d.length<=10) d = p + d;
  return d;
}
const urlWhats = (texto, tel) => 'https://wa.me/'+(telWa(tel)||'')+'?text='+encodeURIComponent(texto);

/* Confirmación dentro de la página */
let accionConfirmar = null;
function confirmar(texto, fn, boton='Sí, borrar'){
  accionConfirmar = fn;
  abrir(`<h3>¿Estás segura?</h3><p>${esc(texto)}</p>
    <div class="dlg-actions"><button style="background:var(--bad);color:#fff" onclick="const f=accionConfirmar;accionConfirmar=null;cerrar();f()">${esc(boton)}</button><button class="sec" onclick="cerrar()">Cancelar</button></div>`);
}

/* Ventana para editar un mensaje y mandarlo */
let compCtx = null;
function componer(id, ctx={}, tel=''){
  const m = MENSAJES.find(x=>x.id===id);
  compCtx = {tel, onSent:ctx._onSent};
  ventanaTexto(m.t, rellenar(m.x,ctx), tel, 'Revisa y cambia lo que esté entre [corchetes].');
}
function ventanaTexto(titulo, texto, tel='', nota=''){
  abrir(`<h3>${esc(titulo)}</h3>
    ${nota?`<p class="muted">${esc(nota)}</p>`:''}
    <textarea id="compTxt">${esc(texto)}</textarea>
    <div class="dlg-actions">
      <button onclick="copiar(document.getElementById('compTxt').value);contarMensaje()">📋 Copiar</button>
      <a class="btn" id="waLink" target="_blank" rel="noopener" onclick="enviado()">🟢 WhatsApp${tel?'':' (elegir chat)'}</a>
      <button class="sec" onclick="cerrar()">Cerrar</button>
    </div>
    <p class="muted" style="margin-bottom:0">Si WhatsApp no se abre, usa "Copiar" y pégalo en el chat.</p>`);
  const ta=$('#compTxt'), a=$('#waLink');
  const act=()=>{ a.href=urlWhats(ta.value, tel); };
  ta.oninput=act; act();
}
function contarMensaje(){ if(compCtx && !compCtx.contado){ compCtx.contado=true; registrar('msg'); } }
function enviado(){
  contarMensaje();
  if(compCtx && compCtx.onSent){ const f=compCtx.onSent; compCtx.onSent=null; setTimeout(f,300); }
  setTimeout(cerrar,300);
}

function semanaActual(){ const d=new Date(); const j=new Date(d.getFullYear(),0,1); return d.getFullYear()+'-'+Math.ceil(((d-j)/864e5+j.getDay()+1)/7); }

function pendientes(){
  const L=[];
  S.clientas.forEach(c=>{
    c.muestras.forEach(m=>{ if(!m.seguida && dias(m.fecha)>=3) L.push({orden:1,ic:'🎁',t:`Seguimiento de muestra a ${c.nombre}`,d:`${m.perfume||'muestra'} · hace ${dias(m.fecha)} días`,
      acc:`componer('seguimiento',{nombre:${JSON.stringify(c.nombre)},perfume:${JSON.stringify(m.perfume||'')},_onSent:()=>marcarMuestra('${c.id}','${m.id}')},${JSON.stringify(c.tel)})`,
      hecho:`marcarMuestra('${c.id}','${m.id}')`}); });
    c.compras.forEach(p=>{
      const saldo=(Number(p.precio)||0)-(Number(p.abonado)||0);
      if(saldo>0) L.push({orden:2,ic:'💵',t:`Cobrar a ${c.nombre}`,d:`${dinero(saldo)} pendiente · ${p.perfume||''}`,
        acc:`componer('cobro',{nombre:${JSON.stringify(c.nombre)},perfume:${JSON.stringify(p.perfume||'')},saldo:'${dinero(saldo)}'},${JSON.stringify(c.tel)})`,
        hecho:`abonar('${c.id}','${p.id}')`, hechoTxt:'Registrar pago'});
    });
    const ult = c.compras.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(ult && !ult.avisado && dias(ult.fecha)>=60) L.push({orden:3,ic:'🔁',t:`Ofrecer recompra a ${c.nombre}`,d:`Compró ${ult.perfume||''} hace ${dias(ult.fecha)} días`,
      acc:`componer('recompra',{nombre:${JSON.stringify(c.nombre)},perfume:${JSON.stringify(ult.perfume||'')},_onSent:()=>marcarAvisado('${c.id}','${ult.id}')},${JSON.stringify(c.tel)})`,
      hecho:`marcarAvisado('${c.id}','${ult.id}')`});
  });
  (S.negocios||[]).forEach(n=>{
    const d=dias(n.ultimo);
    if(['contactado','visitado','interesado'].includes(n.etapa) && n.ultimo && d>=4) L.push({orden:2,ic:'🏪',t:`Seguimiento a ${n.nombre}`,d:`${ETAPAS_N[n.etapa]} · hace ${d} días`,acc:`mensajeNeg('${n.id}')`,hecho:`etapaN('${n.id}','${n.etapa}')`});
    const ult=(n.ventas||[]).map(v=>v.fecha).sort().pop();
    if(n.etapa==='cliente' && ult && dias(ult)>=14 && dias(n.ultimo)>=7) L.push({orden:3,ic:'📦',t:`Resurtir a ${n.nombre}`,d:`Última venta hace ${dias(ult)} días`,acc:`componer('m_resurtido',{negocio:${JSON.stringify(n.nombre)},_onSent:()=>etapaN('${n.id}','cliente')},${JSON.stringify(n.telefono||'')})`,hecho:`etapaN('${n.id}','cliente')`});
  });
  (S.interesadas||[]).forEach(i=>{
    if(['nueva','platique','interesada'].includes(i.etapa) && dias(i.ultimo||i.fecha)>=2) L.push({orden:2,ic:'🌱',t:`Seguimiento a ${i.nombre}`,d:`${ETAPAS[i.etapa]} · último contacto hace ${dias(i.ultimo||i.fecha)} días`,
      acc:`componer('${i.etapa==='nueva'?'r_comento':'r_seg'}',{nombre:${JSON.stringify(i.nombre)},_onSent:()=>contactoInteresada('${i.id}')},${JSON.stringify(i.tel)})`,
      hecho:`contactoInteresada('${i.id}')`});
  });
  S.equipo.forEach(e=>{
    if(!e.bienvenida) L.push({orden:0,ic:'🎉',t:`Darle la bienvenida a ${e.nombre}`,d:'Nueva en tu equipo',
      acc:`componer('bienvenida',{nombre:${JSON.stringify(e.nombre)},_onSent:()=>marcarBienvenida('${e.id}')},${JSON.stringify(e.tel)})`,
      hecho:`marcarBienvenida('${e.id}')`});
  });
  return L.sort((a,b)=>a.orden-b.orden);
}

/* ---------- Bandeja: convierte los mensajes de la tienda en registros ---------- */
function leerLead(texto){
  const m = texto.match(/#LEAD-(MUESTRA|PRODUCTO|MAYOREO|EQUIPO)/i);
  const campos = {};
  texto.split(/\n/).forEach(l=>{ const k=l.match(/^\s*([A-Za-zÁÉÍÓÚáéíóúñÑ]+)\s*:\s*(.+)$/); if(k) campos[k[1].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')]=k[2].trim(); });
  return {tipo: m ? m[1].toUpperCase() : '', campos};
}
function bandeja(){
  abrir(`<h3>📥 Nuevo lead</h3>
    <p class="muted">Cuando alguien llene un formulario de tu tienda, te llega un WhatsApp con <b>#LEAD</b>. Mantén presionado el mensaje, cópialo y pégalo aquí. La app lo guarda donde va y te prepara la respuesta.</p>
    <textarea id="bT" placeholder="Pega aquí el mensaje…" style="min-height:140px"></textarea>
    <label for="bP">Teléfono de quien te escribió (opcional, para contestarle directo)</label><input id="bP" type="tel">
    <p class="muted" id="bV"></p>
    <div class="dlg-actions"><button onclick="procesarLead()">Guardar y responder</button><button class="sec" onclick="cerrar()">Cancelar</button></div>`);
  const t=$('#bT'), v=$('#bV');
  t.oninput=()=>{ const L=leerLead(t.value); v.textContent = L.tipo ? ({MUESTRA:'🎁 Pide muestra → se guarda en Clientas',PRODUCTO:'🛍️ Pregunta por un producto → se guarda en Clientas',MAYOREO:'🏪 Negocio interesado en mayoreo → se guarda en Negocios',EQUIPO:'🌱 Quiere vender contigo → se guarda en Interesadas'}[L.tipo]) : (t.value.trim()?'No encontré #LEAD. Se guardará como clienta nueva.':''); };
  setTimeout(()=>t.focus(),50);
}
function procesarLead(){
  const texto=$('#bT').value.trim(); if(!texto){ toast('Pega el mensaje'); return; }
  const {tipo,campos:c}=leerLead(texto), tel=$('#bP').value.trim(), hoy=hoyISO();
  const nombre = c.nombre || c.negocio || 'Lead '+fmtFecha(hoy);
  if(tipo==='MAYOREO'){
    const tipos={'salon':'salon','barberia':'barberia','unas':'unas','boutique':'boutique','regalos':'regalos','beauty':'beauty_supply','mercado':'mercado'};
    const tk=Object.keys(tipos).find(k=>(c.tipo||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(k));
    S.negocios ||= [];
    S.negocios.push({id:uid(),nombre:c.negocio||nombre,tipo:tk?tipos[tk]:'otro',barrio:c.zona||'Otro',direccion:'',telefono:tel,web:'',fuente:'',por_que:'Te escribió desde tu tienda pidiendo información de mayoreo.',como:'Contéstale hoy y agenda una visita con muestras.',etapa:'interesado',ultimo:hoy,notas:`Contacto: ${c.nombre||''}${c.origen?' · origen: '+c.origen:''}`,ventas:[],origen:'lead'});
    guardar(); cerrar(); render(); componer('l_mayoreo',{nombre:c.nombre||'',negocio:c.negocio||''},tel);
  } else if(tipo==='EQUIPO'){
    S.interesadas ||= [];
    S.interesadas.push({id:uid(),nombre,tel,origen:'Tienda web',notas:c.origen?'origen: '+c.origen:'',etapa:'platique',fecha:hoy,ultimo:hoy});
    guardar(); cerrar(); render(); componer('r_comento',{nombre},tel);
  } else {
    const notas=[c.zona&&'Zona: '+c.zona, c.para, c.perfil&&'Test: '+c.perfil, c.aromas&&'Le gusta: '+c.aromas, c.recomendado&&'Recomendadas: '+c.recomendado, c.temporada&&'Temporada: '+c.temporada, c.uso&&'Uso: '+c.uso, c.producto&&'Preguntó por: '+c.producto, c.origen&&'Origen: '+c.origen].filter(Boolean).join(' · ');
    let cl=S.clientas.find(x=>x.nombre.toLowerCase()===nombre.toLowerCase());
    if(!cl){ cl={id:uid(),nombre,tel,notas,compras:[],muestras:[]}; S.clientas.push(cl); } else { cl.notas=[cl.notas,notas].filter(Boolean).join(' · '); if(tel&&!cl.tel) cl.tel=tel; }
    guardar(); cerrar(); render();
    componer(tipo==='PRODUCTO'?'l_producto':'l_muestra',{nombre:c.nombre||'',perfume:c.producto||undefined,aromas:c.aromas||undefined,zona:c.zona||undefined},cl.tel);
  }
  toast('Lead guardado 📥');
}

/* ---------- AYUDANTES Y COMISIONES ---------- */
const TIPO_AYU = {recomienda:['Me recomienda clientas',10], vende:['Vende, entrega y cobra',20], otro:['Otro porcentaje',15]};
const ayu = id => (S.ayudantes||[]).find(a=>a.id===id);
const r2 = n => Math.round(n*100)/100;
function ventasAyud(aid){
  const r=[]; S.clientas.forEach(c=>c.compras.forEach(p=>{ if(p.ayudante===aid){ const precio=Number(p.precio)||0;
    r.push({c,p,com:r2(precio*(Number(p.pct)||0)/100),cobrada:(Number(p.abonado)||0)>=precio}); } }));
  return r.sort((a,b)=>b.p.fecha.localeCompare(a.p.fecha));
}
function cuentaAyud(aid){
  const v=ventasAyud(aid), mes=hoyISO().slice(0,7);
  const ganado=r2(v.filter(x=>x.cobrada).reduce((s,x)=>s+x.com,0));
  const porCobrar=r2(v.filter(x=>!x.cobrada).reduce((s,x)=>s+x.com,0));
  const pagos=(S.pagosAyud||[]).filter(x=>x.aid===aid).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const pagado=r2(pagos.reduce((s,x)=>s+(Number(x.monto)||0),0));
  const ventasMes=r2(v.filter(x=>x.p.fecha.startsWith(mes)).reduce((s,x)=>s+(Number(x.p.precio)||0),0));
  return {v,pagos,ganado,porCobrar,pagado,debes:r2(Math.max(0,ganado-pagado)),ventasMes};
}
function vAyudantes(){

  return `

      <div style="margin:6px 0">
        <span class="pill">${esc(TIPO_AYU[a.tipo]?.[0]||'Ayudante')} · ${a.pct}%</span>
        ${k.debes>0?`<span class="pill bad">Le debes ${dinero(k.debes)}</span>`:`<span class="pill">Al corriente ✅</span>`}
        ${k.porCobrar>0?`<span class="pill warn">${dinero(k.porCobrar)} cuando paguen sus clientas</span>`:''}
      </div>
      <div class="muted">Ventas este mes: <b>${dinero(k.ventasMes)}</b> · Ganado total: ${dinero(k.ganado)} · Ya le pagaste: ${dinero(k.pagado)}</div>
      ${k.ventasMes>=300 && a.pct<25?`<p style="margin:6px 0 0">🏆 Ya pasó $300 este mes. Puedes premiarla subiéndole a 25%.</p>`:''}
      <details><summary class="muted">Ventas (${k.v.length}) y pagos (${k.pagos.length})</summary>
        ${k.v.map(x=>`<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><div>🛍️ ${esc(x.p.perfume)} · ${esc(x.c.nombre)}<div class="muted">${fmtFecha(x.p.fecha)} · ${dinero(x.p.precio)} × ${x.p.pct}% = <b>${dinero(x.com)}</b> ${x.cobrada?'· cobrada ✅':'· la clienta aún debe ⏳'}</div></div></div>`).join('')}
        ${k.pagos.map(x=>`<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><div>💵 Le pagaste ${dinero(x.monto)}<div class="muted">${fmtFecha(x.fecha)}${x.nota?' · '+esc(x.nota):''}</div></div><button class="small danger" onclick="borrarPagoAyud('${x.id}')">✕</button></div>`).join('')}
      </details>

    </ul></div>`;

    ${id?`<button class="danger" onclick="borrarAyudante('${id}')">Borrar</button>`:''}</div>`);

function guardarAyudante(id){
  const nombre=$('#fNom').value.trim(); if(!nombre){ toast('Escribe el nombre'); return; }
  const pct=Math.max(0,Math.min(50,Number($('#fPct').value)||0));
  const d={nombre,tel:$('#fTel').value.trim(),tipo:$('#fTipo').value,pct};
  (S.ayudantes ||= []); if(id) Object.assign(ayu(id),d); else S.ayudantes.push({id:uid(),fecha:hoyISO(),...d});
  guardar(); cerrar(); render(); toast('Guardada 🤝');
}
function borrarAyudante(id){
  confirmar('Se borrará a esta ayudante y sus pagos. Las ventas se quedan en tus clientas.', ()=>{
    S.ayudantes=S.ayudantes.filter(a=>a.id!==id); S.pagosAyud=(S.pagosAyud||[]).filter(x=>x.aid!==id);
    S.clientas.forEach(c=>c.compras.forEach(p=>{ if(p.ayudante===id){ delete p.ayudante; delete p.pct; } }));
    guardar(); render(); });
}
function pagarAyud(aid){
  const a=ayu(aid), k=cuentaAyud(aid);
  abrir(`<h3>💵 Pagarle a ${esc(a.nombre)}</h3><p class="muted">Le debes ${dinero(k.debes)} de ventas ya cobradas.</p>
    <label>¿Cuánto le pagaste?</label><input id="fMon" type="number" inputmode="decimal" value="${k.debes}">
    <label>Fecha</label><input id="fFec" type="date" value="${hoyISO()}">
    <label>Nota (Zelle, efectivo…)</label><input id="fNot">
    <div class="dlg-actions"><button onclick="guardarPagoAyud('${aid}')">Guardar</button><button class="sec" onclick="cerrar()">Cancelar</button></div>`);
}
function guardarPagoAyud(aid){
  const monto=Number($('#fMon').value)||0; if(monto<=0){ toast('Pon cuánto le pagaste'); return; }
  (S.pagosAyud ||= []).push({id:uid(),aid,monto,fecha:$('#fFec').value||hoyISO(),nota:$('#fNot').value.trim()});
  guardar(); cerrar(); render(); toast('Pago anotado ✅');
}
function borrarPagoAyud(id){ confirmar('Se borrará este pago.', ()=>{ S.pagosAyud=S.pagosAyud.filter(x=>x.id!==id); guardar(); render(); }); }
function cuentaWhats(aid){
  const a=ayu(aid), k=cuentaAyud(aid);
  const linea=x=>`• ${fmtFecha(x.p.fecha)} · ${x.p.perfume} (${dinero(x.p.precio)}) × ${x.p.pct}% = ${dinero(x.com)}`;
  const cob=k.v.filter(x=>x.cobrada), pen=k.v.filter(x=>!x.cobrada);
  const partes=[`Hola ${a.nombre} 💕 Aquí va tu cuenta de comisiones:`,
    cob.length?'✅ Ventas ya cobradas:\n'+cob.map(linea).join('\n'):'Aún no hay ventas cobradas.'];
  if(pen.length) partes.push('⏳ Pendientes (la clienta aún no termina de pagar):\n'+pen.map(linea).join('\n'));
  partes.push(`Ganado: ${dinero(k.ganado)}\nYa te pagué: ${dinero(k.pagado)}\nTe debo: ${dinero(k.debes)}`,'¡Gracias por tu ayuda! 🙌');
  ventanaTexto('📲 Cuenta de '+a.nombre, partes.join('\n\n'), a.tel);
}

function leerLista(texto){
  return texto.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const m = l.match(/\$?\s*(\d+(?:[.,]\d{1,2})?)\s*(?:usd|dlls?|dólares)?\s*$/i);
    const precio = m ? Number(m[1].replace(',','.')) : 0;
    let nombre = (m ? l.slice(0,m.index) : l).replace(/[-–—:|·$]+\s*$/,'').trim();
    const tipo = /caballero|hombre|\bmen\b|\bél\b/i.test(nombre)?'caballero':/dama|mujer|women|\bella\b/i.test(nombre)?'dama':'';
    nombre = nombre.replace(/(^|[\s(])(eau de parfum|eau de toilette|edp|edt|para (dama|caballero|hombre|mujer)|fragancia|perfume|dama|caballero|hombre|mujer|men|women)(?=[\s)]|$|[-–—:|·(])/ig,' ').replace(/[()]/g,'').replace(/\s{2,}/g,' ').replace(/[-–—:|·]+\s*$/,'').trim();
    return nombre ? {nombre, tipo, precio} : null;
  }).filter(Boolean);
}

/* ---------- Metas y sistema de ventas ---------- */
function registrar(tipo){ (S.actividad ||= []).push({f:hoyISO(), t:tipo}); if(S.actividad.length>800) S.actividad.splice(0,S.actividad.length-800); guardar(); }
function inicioSemana(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.toISOString().slice(0,10); }
function numeros(){
  const mes=hoyISO().slice(0,7), sem=inicioSemana();
  let ventasMes=0, piezasMes=0, ventasSem=0, muestrasSem=0, muestrasMes=0, convertidas=0, muestrasTot=0;
  S.clientas.forEach(c=>{
    c.compras.forEach(p=>{ if(p.fecha.startsWith(mes)){ ventasMes+=Number(p.precio)||0; piezasMes++; } if(p.fecha>=sem) ventasSem++; });
  });
  (S.negocios||[]).forEach(n=>(n.ventas||[]).forEach(v=>{ if(v.fecha.startsWith(mes)) ventasMes+=Number(v.monto)||0; if(v.fecha>=sem) ventasSem++; }));
  S.clientas.forEach(c=>{
    c.muestras.forEach(m=>{ muestrasTot++; if(m.fecha>=sem) muestrasSem++; if(m.fecha.startsWith(mes)) muestrasMes++; if(c.compras.some(p=>p.fecha>=m.fecha)) convertidas++; });
  });
  const mensajesSem=(S.actividad||[]).filter(a=>a.f>=sem).length;
  const conv = muestrasTot>=5 ? convertidas/muestrasTot : 0.3;
  const precios=S.perfumes.map(p=>Number(p.precio)).filter(Boolean);
  const promedio = piezasMes ? ventasMes/piezasMes : (precios.length? precios.reduce((a,b)=>a+b,0)/precios.length : 45);
  const hoy=new Date(), finMes=new Date(hoy.getFullYear(),hoy.getMonth()+1,0).getDate(), quedan=finMes-hoy.getDate()+1;
  return {ventasMes,piezasMes,ventasSem,muestrasSem,muestrasMes,mensajesSem,conv,convReal:muestrasTot>=5,promedio,quedan};
}
function tarjetaMeta(){
  const meta=Number(S.ajustes.meta)||0, N=numeros(), g=Number(S.ajustes.ganancia)||0;
  if(!meta) return `<div class="card"><h3>🎯 Ponte una meta del mes</h3><p class="muted">Dime cuánto quieres vender y la app te dice cuántos perfumes, muestras y mensajes necesitas cada semana.</p><button class="small" onclick="formMeta()">Poner mi meta</button></div>`;
  const pct=Math.min(100,Math.round(N.ventasMes/meta*100)), falta=Math.max(0,meta-N.ventasMes);
  const piezas=Math.ceil(falta/N.promedio), semanas=Math.max(1,Math.ceil(N.quedan/7));
  const muestrasNec=Math.ceil(piezas/Math.max(0.1,N.conv)), muestrasSemana=Math.ceil(muestrasNec/semanas), mensajesSemana=muestrasSemana*2;
  const consejo = falta<=0 ? '🎉 ¡Llegaste a tu meta! Aprovecha para pedir referidas a tus clientas felices.'
    : N.muestrasSem < muestrasSemana ? `🎁 Esta semana llevas ${N.muestrasSem} de ${muestrasSemana} muestras. Regala ${muestrasSemana-N.muestrasSem} más.`
    : N.mensajesSem < mensajesSemana ? `💬 Manda ${mensajesSemana-N.mensajesSem} mensajes más esta semana: catálogo, seguimiento o recompra.`
    : '💪 Vas muy bien esta semana. Dale seguimiento a tus muestras para cerrar las ventas.';
  return `<div class="card">
    <div class="spread"><h3>🎯 Mi meta: ${dinero(meta)}</h3><button class="ghost small" onclick="formMeta()">Cambiar</button></div>
    <div style="background:var(--soft);border-radius:99px;height:14px;overflow:hidden;margin:8px 0" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="height:100%;width:${pct}%;background:var(--brand);border-radius:99px"></div></div>
    <p style="margin:0"><b>${dinero(N.ventasMes)}</b> vendido (${pct}%)${g?` · ganancia aprox. <b>${dinero(N.ventasMes*g/100)}</b>`:''}</p>
    ${falta>0?`<p class="muted" style="margin:4px 0 10px">Te faltan ${dinero(falta)} y quedan ${N.quedan} días. Son unos <b>${piezas} perfume${piezas===1?'':'s'}</b> (${dinero(Math.ceil(falta/N.quedan))} al día).</p>`:''}
    <p class="muted" style="margin:0 0 4px;font-weight:600">Tu semana</p>
    <div class="stats">
      <div class="stat"><b>${N.mensajesSem}${falta>0?`<small style="font-size:.7em;color:var(--muted)">/${mensajesSemana}</small>`:''}</b><span>Mensajes</span></div>
      <div class="stat"><b>${N.muestrasSem}${falta>0?`<small style="font-size:.7em;color:var(--muted)">/${muestrasSemana}</small>`:''}</b><span>Muestras</span></div>
      <div class="stat"><b>${N.ventasSem}</b><span>Ventas</span></div>
    </div>
    <p style="margin:10px 0 0">${consejo}</p>
    <p class="muted" style="margin:6px 0 0;font-size:.8rem">${N.convReal?`De cada 10 muestras, ${Math.round(N.conv*10)} terminan en venta.`:'Calculado con 3 ventas por cada 10 muestras, hasta que tengas tus propios números.'}</p>
  </div>`;
}

function importar(f){

}

async function hashPin(pin){
  const sal = S.seguridad?.sal || '';
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sal + ':' + pin));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

    <label for="nPin2">Repite el PIN</label><input id="nPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <div class="dlg-actions"><button onclick="guardarPin()">Guardar PIN</button>${activo?'<button class="danger" onclick="quitarPin()">Quitar PIN</button>':''}<button class="sec" onclick="cerrar()">Cancelar</button></div>`);

async function guardarPin(){
  const a=$('#nPin').value, b=$('#nPin2').value;
  if(!/^\d{4,6}$/.test(a)){ toast('El PIN debe tener de 4 a 6 números'); return; }
  if(a!==b){ toast('Los PIN no son iguales'); return; }
  const sal = [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
  S.seguridad = {sal, pin:''}; S.seguridad.pin = await hashPin(a);
  guardar(); cerrar(); render(); toast('PIN activado 🔒');

  const L=$('#lock'); L.classList.remove('hidden'); document.body.style.overflow='hidden';
  const inp=$('#pinIn'); inp.value=''; setTimeout(()=>inp.focus(),50);
  const probar = async ()=>{
    if(intentos>=5){ $('#pinMsg').textContent='Demasiados intentos. Espera 30 segundos.'; return; }
    if(await hashPin(inp.value)===S.seguridad.pin){ intentos=0; L.classList.add('hidden'); document.body.style.overflow=''; $('#pinMsg').textContent=''; }
    else { intentos++; inp.value=''; $('#pinMsg').textContent='PIN incorrecto'; if(intentos>=5) setTimeout(()=>{intentos=0;$('#pinMsg').textContent='';},30000); }
  };
  $('#pinBtn').onclick=probar; inp.onkeydown=e=>{ if(e.key==='Enter') probar(); };
  $('#pinOlvide').onclick=()=>{
    $('#pinMsg').innerHTML='Si olvidaste tu PIN, la única forma de entrar es borrar los datos de este aparato y cargar un respaldo. <button class="small danger" id="pinBorrar">Borrar datos de este aparato</button>';
    $('#pinBorrar').onclick=()=>{ try{ localStorage.removeItem(KEY); }catch(e){} S=defaults(); L.classList.add('hidden'); document.body.style.overflow=''; render(); toast('Datos borrados. Puedes cargar tu respaldo en Más.'); };
  };
}
let oculta = 0;
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') oculta=Date.now(); else if(oculta && Date.now()-oculta>5*60*1000){ oculta=0; bloquear(); } });

function avisoRespaldo(){
  const hay = S.clientas.length || S.perfumes.length;
  const ult = S.ultimoRespaldo ? dias(S.ultimoRespaldo) : 999;
  return hay && ult>=14 ? `<div class="card aviso"><h3>💾 Haz un respaldo</h3><p class="muted">${S.ultimoRespaldo?`Tu último respaldo fue hace ${ult} días.`:'Todavía no has guardado un respaldo.'} Tus datos viven en este aparato; si se pierde o se borra, el respaldo los recupera.</p><button class="small" onclick="exportar()">⬇️ Descargar respaldo</button></div>` : '';
}

try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

render();
bloquear();
conectarNube();
</script>
</body>
</html>
