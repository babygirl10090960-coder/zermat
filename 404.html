<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Fragancias Araceli</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<style>
:root{--plum:#2a0f22;--rose:#b24a72;--paper:#fffafc;--ink:#22131c;--muted:#6e5866}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px;text-align:center}
main{max-width:460px}
.ico{font-size:3.4rem;margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.7rem,6vw,2.3rem);margin:8px 0 10px;color:var(--plum)}
p{color:var(--muted);margin:0 0 22px}
a.btn{display:inline-block;background:var(--rose);color:#fff;text-decoration:none;font-weight:600;padding:13px 24px;border-radius:999px;margin:4px}
a.btn.sec{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
a:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="ico" aria-hidden="true">🌸</p>
  <h1>Esta página no existe</h1>
  <p>Tal vez el enlace está incompleto o la página cambió de lugar. Las fragancias siguen aquí.</p>
  <a class="btn" href="/">Volver al inicio</a>
  <a class="btn sec" href="/#aroma">Hacer el test de aroma</a>
</main>
</body>
</html>
